services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chrome:
        condition: service_started
    networks:
      - atlas

  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - atlas

  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atlas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - atlas

  chrome:
    image: selenium/standalone-chrome
    container_name: atlas_chrome
    restart: unless-stopped
    ports:
      - "4444:4444"
    shm_size: 4gb
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - atlas

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    command: php artisan horizon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chrome:
        condition: service_started
    networks:
      - atlas
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atlas_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - atlas

volumes:
  postgres_data:
  redis_data:

networks:
  atlas:
    driver: bridge