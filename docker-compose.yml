services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      chrome:
        condition: service_started
    networks:
      - atlas

  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - atlas

  mysql:
    image: mysql:8.0
    container_name: atlas_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - atlas
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - atlas

  chrome:
    image: selenium/standalone-chrome
    container_name: atlas_chrome
    restart: unless-stopped
    ports:
      - "4444:4444"
    shm_size: 4gb
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    networks:
      - atlas

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - CHROMEDRIVER_URL=http://chrome:4444/wd/hub
    command: php artisan horizon
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      chrome:
        condition: service_started
    networks:
      - atlas

volumes:
  mysql_data:
  redis_data:

networks:
  atlas:
    driver: bridge