; -----------------------------------------------------------------------
; Custom PHP configuration for Atlas production environment.
;
; memory_limit     - increased from 128M default to handle large Excel
;                    exports (4,500+ listings × multiple sheets).
; max_execution_time - extended for long-running scraper and export jobs.
; upload_max_filesize - allows larger file uploads through the web UI.
; post_max_size    - must be >= upload_max_filesize.
; -----------------------------------------------------------------------

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M